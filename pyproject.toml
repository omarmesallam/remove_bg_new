[project]
name = "remove-bg-new"
version = "0.1.0"
description = "PDF background removal tool for scanned documents"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
]

[project.scripts]
remove-pdf-bg = "main:main"
